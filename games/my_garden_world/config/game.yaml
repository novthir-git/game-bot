# 《我的花园世界》游戏侧配置
#
# 注意：本文件中标记 TODO 的字段尚未确认，需要在真机/模拟器上采集后填写。

app:
  name: "我的花园世界"
  platform: android_apk        # 仅支持 APK 版；微信/抖音小游戏版布局不同，不通用

  # TODO: 包名待确认。用以下命令采集（先手动把游戏切到前台）：
  #   adb shell dumpsys window | grep mCurrentFocus
  # 或列出全部第三方包再筛选：
  #   adb shell pm list packages -3
  package: ""

  # TODO: 启动 Activity 待确认。采集方式：
  #   adb shell dumpsys package <package> | grep -A2 "android.intent.action.MAIN"
  main_activity: ""

  # 冷启动到主界面的预期耗时上限（秒），超时判定为启动失败
  launch_timeout_sec: 120

matching:
  # 模板匹配默认阈值。本游戏为水彩风格，低对比度 + 渐变背景，
  # 阈值不宜过高，先按 0.78 起调。
  default_threshold: 0.78
  # 匹配前转灰度，可显著降低色彩渐变带来的干扰
  grayscale: true

ocr:
  # 本项目不使用 OCR，不引入任何 OCR 依赖。
  #
  # 原因：bot 需要的是「状态判断」而非「数值读取」；且本游戏为艺术字带描边，
  # 通用 OCR 准确率有限、单次耗时数十至两百毫秒，性价比低。
  #
  # 替代手段（按优先级）：
  #   1. 多点比色       按钮亮/灰、开关、红点。耗时 <1ms，无误差
  #                     判据示例：max(r,g,b) - min(r,g,b) < 20 即为置灰
  #   2. 模板匹配       判断元素是否存在
  #   3. 进度条像素长度  体力条、成长度等连续量
  #   4. 数字模板切分   确需读数字时，截取 0~9 十张小图逐位匹配。
  #                     游戏 HUD 字体固定、仅 10 个字形，准确率高于通用 OCR
  #                     且快一个量级，也无需新增依赖
  #
  # 核心原则：计数与计时由 bot 自行维护，不从屏幕读取。
  #   花架上架次数 -> 自己计数，不读界面上的 87/135
  #   4 分钟冷却   -> 用系统时间计时，不读游戏内倒计时
  #   读屏只会为本来不会出错的环节额外引入一个出错源。
  #
  # 唯一可能需要 OCR 的场景：订单以纯文字列出花卉名称（本游戏花卉上百种，
  # 逐一做图标模板成本过高）。需先在游戏内确认订单是否附带花卉图标——
  # 若附带，仍用图标模板。确实需要时再单独选型并评估引入成本。
  enabled: false

anchors:
  # 界面锚点：用于判断「当前在哪个界面」。
  # 每一项对应 templates/ 下的一张模板图，路径相对 templates/ 目录。
  # TODO: 全部待截图采集。
  main_screen: "main/anchor_main.png"
  flower_rack: "flower_rack/anchor_rack.png"
  daily_panel: "daily/anchor_daily.png"

recovery:
  # 异常兜底：连续 N 次找不到目标就执行恢复流程
  max_miss_before_recover: 5
  # 恢复流程：依次尝试关闭弹窗 -> 点空白 -> 连按返回键 -> 重启 App
  steps:
    - close_popup
    - tap_blank
    - press_back_repeat
    - restart_app
  press_back_times: 3
